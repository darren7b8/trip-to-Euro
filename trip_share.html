 '<div class="card">'+ks.map(k=>{const a=Q[k]||0,p=P[k]||0;return '<div class="row" style="padding-bottom:0"><span>'+esc(k)+'</span><span>'+f(a)+' / '+f(p)+'</span></div><div class="bar"><i style="width:'+(p?Math.min(100,a/p*100):a?100:0)+'%'+(p&&a>p?';background:var(--ac)':'')+'"></i></div>'}).join('')+'</div>'+
 '<h3>每日帳目</h3>'+(Object.keys(g).length?Object.keys(g).sort().map(d=>'<div class="card"><div class="row" style="padding-top:0"><b>'+md(d)+'</b><b>'+f(g[d].reduce((s,r)=>s+my(r),0))+'</b></div>'+g[d].map(r=>'<div class="row mu"><span>'+esc(r.item)+(r.who?'('+esc(r.who)+'付)':'')+'</span><span>'+esc(r.amt)+' '+esc(r.cur)+(r.mine!==''&&r.mine!=null?' → 我 '+esc(r.mine):'')+'</span></div>').join('')+'</div>').join(''):'<div class="note">尚無帳目</div>')+
 '<div class="note">匯率:'+Object.keys(rt).map(k=>k+'='+rt[k]).join('、')+'(取自 Excel「預算」I:J 欄)</div>'}
const P1='請把附上的訂單(機票/火車/音樂會)整理成「訂位」欄位:類型、日期、開始、結束、名稱、出發地、目的地/場地、確認碼、座位備註、連結、金額、幣別。看不清楚的請留空並告訴我。';
const P2='請把附上的飯店訂單整理成「住宿」欄位:名稱、城市、入住日、退房日、地址、確認碼、電話、連結、備註、金額、幣別。看不清楚的請留空並告訴我。';
const P3='這是 Lightsplit 的帳目截圖,請整理成「Lightsplit帳目」欄位:日期、項目、類別、金額、幣別、付款人、我的分攤(原幣別)、備註。';
const vIm=()=>'<div class="card"><b>① 訂位:機票/火車/音樂會</b><div class="mu">把 PDF 或截圖傳到 Claude 對話,貼上下面的指令,我整理後更新 Excel 與這個網頁。</div><div class="btns"><a data-cp="'+esc(P1)+'">📋 複製指令</a></div></div>'+
 '<div class="card"><b>② 住宿:飯店訂單</b><div class="mu">同上,傳訂單 PDF 或截圖。</div><div class="btns"><a data-cp="'+esc(P2)+'">📋 複製指令</a></div></div>'+
 '<div class="card"><b>③ 每日記帳:Lightsplit</b><div class="mu">每天截圖當日帳目傳給 Claude,我補到「Lightsplit帳目」。「我的分攤」請在截圖中標出或告訴我。</div><div class="btns"><a data-cp="'+esc(P3)+'">📋 複製指令</a></div></div>'+
 '<div class="card"><b>④ 自己填 Excel,再匯入</b><div class="mu">工作表:行程、訂位、住宿、預算、Lightsplit帳目(名稱與欄位順序請保留)。存檔後在此選檔:</div><div class="btns"><label class="imp">匯入 Excel<input id="f" type="file" accept=".xlsx,.xls" hidden></label></div></div>'+
 '<div class="note">Claude 更新後會重新發佈同一個網頁連結,重新整理即可看到新資料;若你在手機上拖曳過行程,更新前請先複製調整後行程。</div>';
const T=[['today','今天'],['tl','時間軸'],['bk','訂位']],V={today:vToday,tl:vTl,bk:vBk,bd:vBd,im:vIm};
function render(){if(document.querySelector('#m details'))op=new Set([...document.querySelectorAll('#m details[open]')].map(x=>x.dataset.d));
 $('#tb').innerHTML=T.map(t=>'<button data-tab="'+t[0]+'"'+(t[0]==tab?' class="on"':'')+'>'+t[1]+'</button>').join('');$('#m').innerHTML=V[tab]()}
function nd(v){if(typeof v==='number')return new Date(Math.floor(v-25569)*864e5).toISOString().slice(0,10);
 const m=String(v||'').match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);return m?m[1]+'-'+p2(m[2])+'-'+p2(m[3]):''}
function nt(v){if(typeof v==='number'&&v<1){const t=Math.round(v*1440);return p2(t/60|0)+':'+p2(t%60)}
 const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?p2(m[1])+':'+m[2]:''}
async function imp(fl){if(!fl)return;
 try{const wb=XLSX.read(await fl.arrayBuffer(),{type:'array'});
  const g=n=>{const k=wb.SheetNames.find(x=>x.indexOf(n)>=0);return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:''}).slice(1):[]};
  const it=g('行程').map(a=>({d:nd(a[0]),s:nt(a[1]),e:nt(a[2]),c:a[3],t:a[4],p:a[5],tr:a[6],du:a[7],l:a[8],n:a[9]})).filter(r=>r.d&&r.t);
  if(!it.length)throw 0;
  const b=g('預算'),rate={TWD:1};b.forEach(a=>{if(a[8]&&typeof a[9]==='number')rate[a[8]]=a[9]});
  D={v:D.v,it:it,rate:rate,
   bd:b.map(a=>({d:nd(a[0]),cat:a[1],item:a[2],amt:+a[3]||0,cur:a[4]||'TWD',paid:a[6]})).filter(r=>r.item&&r.amt),
   bk:g('訂位').map(a=>({ty:String(a[0]),d:nd(a[1]),s:nt(a[2]),e:nt(a[3]),n:a[4],f:a[5],to:a[6],cf:a[7],nt:a[8],l:a[9],amt:+a[10]||0,cur:a[11]||'TWD'})).filter(r=>r.d&&r.n),
   ht:g('住宿').map(a=>({n:a[0],c:a[1],i:nd(a[2]),o:nd(a[3]),ad:a[4],cf:a[5],ph:a[6],l:a[7],nt:a[8],amt:+a[9]||0,cur:a[10]||'TWD'})).filter(r=>r.i&&r.o&&r.n),
   ac:g('帳目').map(a=>({d:nd(a[0]),item:a[1],cat:a[2],amt:+a[3]||0,cur:a[4]||'TWD',who:a[5],mine:a[6],n:a[7]})).filter(r=>r.d&&r.item&&r.amt)};
  save();sel=null;tab='today';render();toast('匯入完成')}catch(x){alert('讀取失敗:請確認使用旅遊規劃 Excel 範本(含「行程」工作表)')}}
document.addEventListener('change',e=>{if(e.target.id=='f')imp(e.target.files[0])});
let dg=null;
const clr=()=>document.querySelectorAll('.ot,.ob,.od').forEach(x=>x.classList.remove('ot','ob','od'));
$('#m').addEventListener('pointerdown',e=>{const h=e.target.closest('.hd');if(!h)return;e.preventDefault();const el=h.closest('.it');dg={i:+el.dataset.i,el:el,t:null};el.classList.add('drag')});
addEventListener('pointermove',e=>{if(!dg)return;
 if(e.clientY<100)scrollBy(0,-14);else if(e.clientY>innerHeight-100)scrollBy(0,14);
 clr();dg.t=null;
 const els=document.elementsFromPoint(e.clientX,e.clientY).filter(x=>!dg.el.contains(x));
 const it=els.find(x=>x.classList&&x.classList.contains('it'));
 if(it){const r=it.getBoundingClientRect(),af=e.clientY>r.top+r.height/2;it.classList.add(af?'ob':'ot');dg.t={b:+it.dataset.i,af:af};return}
 const dt=els.find(x=>x.tagName=='DETAILS');
 if(dt){dt.classList.add('od');dg.t={day:dt.dataset.d}}});
addEventListener('pointerup',()=>{if(!dg)return;const g=dg;dg=null;clr();g.el.classList.remove('drag');if(!g.t)return;
 const it=D.it,x=it.splice(g.i,1)[0];
 if(g.t.day!=null){x.d=g.t.day;let l=-1;it.forEach((r,i)=>{if(r.d==x.d)l=i});it.splice(l+1,0,x)}
 else{let b=g.t.b;if(b>g.i)b--;x.d=it[b].d;it.splice(g.t.af?b+1:b,0,x)}
 save();render()});
addEventListener('pointercancel',()=>{if(dg){dg.el.classList.remove('drag');dg=null;clr()}});
function cpy(t,ok){try{navigator.clipboard.writeText(t).then(()=>ok&&toast('已複製'),()=>alert(t))}catch(x){alert(t)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-sel],[data-cp],#cp');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0)}
 else if(t.dataset.sel){sel=t.dataset.sel;render()}
 else if(t.dataset.cp)cpy(t.dataset.cp,1);
 else{const s=days().reduce((a,x)=>a.concat(x.r),[]).map(r=>[r.d,r.s,r.e,r.c,r.t,r.p,r.tr,r.du,r.l,r.n].map(v=>String(v==null?'':v).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
  try{navigator.clipboard.writeText(s).then(()=>toast('已複製,到 Excel「行程」A2 貼上'),()=>{const a=$('#ta');a.hidden=false;a.value=s;a.select()})}catch(x){const a=$('#ta');a.hidden=false;a.value=s;a.select()}}});
render();
</script></body></html>
